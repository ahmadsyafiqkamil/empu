[project]
name = "empu"
version = "0.1.0"
description = "Empu: turn a master's narrated work video into a watchable, validated craft dictionary."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "tenacity>=9.0",
  "rapidfuzz>=3.10",
  "pympi-ling>=1.70",
  "pyyaml>=6.0",
  "pillow>=11.0",
  "typer>=0.12",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]

[project.scripts]
empu = "empu.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["empu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
