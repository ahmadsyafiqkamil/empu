    sam_prompt: low wooden stool
    verified: false
  - id: taplak
    label: taplak
    category: tool
    variants: [taplak, kain alas]
    gloss_id: kain alas di pangkuan agar tidak terkena tetesan malam
    gloss_en: lap cloth that protects from dripping wax
    visual: true
    sam_prompt: cloth on lap
    verified: false   # cek
  - id: kenceng
    label: kenceng
    category: tool
    variants: [kenceng, kenceng lorod]
    stage: nglorod
    gloss_id: panci atau wajan besar untuk merebus kain saat nglorod
