# Craft pack: Batik Tulis — DRAF v0.1.0
#
# Pack adalah satu-satunya tempat pengetahuan khusus keterampilan. Kode pipeline membaca file ini
# dan tidak boleh berisi istilah batik secara hardcode.
#
# Sumber benih: glosarium uji kelayakan 28 Okt 2026, istilah yang ditemukan Muse di uji v1
# (nyamplung, cucuk, gagang, dingklik, spangkring), dan istilah umum di literatur batik.
# SEMUA entri berstatus draf (verified: false) sampai dicek maestro atau sumber rujukan.
# Entri bertanda "# cek" adalah yang paling perlu diverifikasi.
#
# Kategori: tool | tool_part | material | dye | stage | technique | motif | other
# visual: true  -> layak dipotong dengan SAM 3.1 (pakai sam_prompt, bahasa Inggris, pendek)
# Aturan validasi: id unik; varian tidak boleh dipakai dua kali, baik antar-istilah maupun
# antara istilah dan tahap; stage pada istilah harus merujuk id tahap yang ada.
# Divalidasi oleh api/empu/packs.py (tes: api/tests/test_packs.py).

id: batik_tulis
version: 0.1.1
name:
  id: Batik Tulis
  en: Hand-drawn batik (batik tulis)
languages: [id, jv]
prompt_context: >
  Batik tulis adalah kain (biasanya mori) yang digambari pola, lalu malam (lilin batik) panas
  ditorehkan dengan canting sebagai perintang warna. Kain kemudian diwarnai (celup atau colet),
  warnanya dikunci (fiksasi), lalu malamnya diluruhkan dengan air mendidih (nglorod).
  Urutan bisa berulang untuk beberapa warna. Narasumber biasanya berbicara bahasa Indonesia
  bercampur bahasa Jawa, dan istilah bisa berbeda antardaerah (Solo, Yogyakarta, Pekalongan,
  Cirebon, Madura, dan lain-lain).

# Contoh salah tulis pengenal suara umum, dari subtitle otomatis YouTube di uji kelayakan.
# Dipakai di prompt Mode B. Bukan daftar koreksi otomatis.
asr_error_examples:
  - {heard: "spang King", correct: spangkring}
  - {heard: "watera gelas", correct: waterglass}
  - {heard: ngelorot, correct: nglorod}

stages:
  - id: persiapan_kain
    label: {id: Persiapan kain, en: Cloth preparation}
    variants: [mencuci mori, merebus mori, ngemplong, kemplong, ngetel]   # cek: ngemplong, ngetel
  - id: memola
    label: {id: Membuat pola, en: Drawing the pattern}
    variants: [memola, molani, nyorek, ngeblat, sketsa, menggambar pola, pola]   # cek: ngeblat
  - id: nglowong
    label: {id: Mencanting garis utama, en: Outlining with wax}
    variants: [nglowong, ngelowong, klowong, klowongan, ngengreng, ngrengreng, rengrengan]
  - id: nerusi
    label: {id: Mencanting sisi balik, en: Tracing the reverse side}
    variants: [nerusi, terusan, nerus]
  - id: ngiseni
    label: {id: Mengisi isen-isen, en: Filling details}
    variants: [ngiseni, isen-isen, isen]
  - id: nembok
    label: {id: Menutup bidang dengan malam, en: Blocking areas with wax}
    variants: [nembok, nemboki, tembok, tembokan, nutup, menutup]
  - id: pewarnaan
    label: {id: Pewarnaan, en: Dyeing}
    variants: [pewarnaan, mewarna, mewarnai, celup, mencelup, pencelupan, medel]   # cek: medel
  - id: ngerok
    label: {id: Mengerok malam, en: Scraping off wax}
    variants: [ngerok, kerok, ngerik, nggirah]   # cek: nggirah
  - id: mbironi
    label: {id: Menutup bagian sebelum warna kedua, en: Re-waxing before second dye}
    variants: [mbironi, bironi, biron]   # cek
  - id: nyoga
    label: {id: Pencelupan soga, en: Soga (brown) dyeing}
    variants: [nyoga]
  - id: fiksasi
    label: {id: Penguncian warna, en: Colour fixing}
    variants: [fiksasi, mengunci warna, penguncian, fixer]
  - id: nglorod
    label: {id: Meluruhkan malam, en: Wax removal by boiling}
    variants: [nglorod, ngelorod, ngelorot, lorod, lorot, pelorodan, melorod, dilorod, dilorot, ngebyok]
  - id: finishing
    label: {id: Mencuci dan menjemur, en: Rinsing and drying}
    variants: [membilas, mencuci, menjemur, dijemur, diangin-anginkan, jemur]

terms:
  # --- Alat ---
  - id: canting
    label: canting
    category: tool
    variants: [canting, tjanting, nyanting, mencanting, dicanting]
    stage: nglowong
    gloss_id: alat pena kecil dari tembaga bergagang bambu untuk menorehkan malam cair
    gloss_en: small copper pen with a bamboo handle used to draw with hot wax
    visual: true
    sam_prompt: wooden stick with copper tip, pen with wooden handle
    verified: false
  - id: canting_klowongan
    label: canting klowongan
    category: tool
    variants: [canting klowongan, canting klowong]
    stage: nglowong
    gloss_id: canting untuk membuat garis utama motif
    gloss_en: canting for outlining the main pattern
    visual: true
    sam_prompt: wooden stick with copper tip, pen with wooden handle
    verified: false   # cek
  - id: canting_cecekan
    label: canting cecekan
    category: tool
    variants: [canting cecekan, canting isen, canting cecek]
    stage: ngiseni
    gloss_id: canting bercucuk kecil untuk titik-titik isen-isen
    gloss_en: fine-spout canting for dotted fillings
    visual: true
    sam_prompt: wooden stick with copper tip, pen with wooden handle
    verified: false   # cek
  - id: canting_tembokan
    label: canting tembokan
    category: tool
    variants: [canting tembokan, canting tembok]
    stage: nembok
    gloss_id: canting bercucuk besar untuk menutup bidang luas
    gloss_en: wide-spout canting for blocking large areas
    visual: true
    sam_prompt: wide spout wax pen held in hand, thick copper nib on bamboo stick
    verified: false   # cek
  - id: wajan
    label: wajan
    category: tool
    variants: [wajan, wajan kecil]
    gloss_id: wajan kecil untuk mencairkan malam
    gloss_en: small pan for melting the wax
    visual: true
    sam_prompt: small black wok with melted wax
    verified: false
  - id: kompor
    label: kompor
    category: tool
    variants: [kompor, kompor batik, kompor minyak, anglo]
    gloss_id: pemanas untuk menjaga malam tetap cair (anglo = tungku arang)
    gloss_en: small stove that keeps the wax liquid (anglo = charcoal brazier)
    visual: true
    sam_prompt: small stove
    verified: false
  - id: gawangan
    label: gawangan
    category: tool
    variants: [gawangan, gawang]
    gloss_id: rak kayu atau bambu untuk membentangkan kain saat dicanting
    gloss_en: wooden or bamboo rack that holds the cloth while drawing
    visual: true
    sam_prompt: wooden rack holding cloth
    verified: false
  - id: spangkring
    label: spangkring
    category: tool
    variants: [spangkring, spang kring, sangkring]   # cek: sangkring
    gloss_id: bingkai atau ram untuk merentangkan kain
    gloss_en: frame or hoop that stretches the cloth
    visual: true
    sam_prompt: wooden hoop frame holding cloth
    verified: false
  - id: dingklik
    label: dingklik
    category: tool
    variants: [dingklik]
    gloss_id: bangku kayu pendek untuk duduk saat membatik
    gloss_en: low wooden stool for sitting while drawing
