    sam_prompt: small weight
    verified: false   # cek
  - id: kuas
    label: kuas
    category: tool
    variants: [kuas]
    gloss_id: kuas untuk mencolet warna atau menutup bidang dengan malam
    gloss_en: brush for painting dye or blocking with wax
    visual: true
