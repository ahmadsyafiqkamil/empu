# Set uji Empu
#
# PENTING: video YouTube di bawah milik kreatornya. Hanya untuk evaluasi INTERNAL.
# Jangan commit videonya, jangan dipakai di demo atau video submission,
# dan jangan dirilis sebagai dataset. Repo hanya menyimpan ID dan potongan waktu.
#
# Lokasi video: env EMPU_TESTDATA_DIR (default ./data-uji, sudah di-.gitignore).
# Saat ini videonya ada di folder unduhan "arsip-hidup-batik/" (subfolder 1-…, 2-…, 3-…, 4-…).
# Cari file dengan pola "*[<youtube_id>]*.mp4". Subtitle otomatis: "*[<id>]*.id-orig.vtt" atau ".id.vtt".

version: 1

clips:
  - id: ngertibatik-proses
    youtube_id: 7-WQ3DKKn0w
    start_s: 0
    duration_s: 241
    purpose: >
      Proses lengkap. Narasi mulai sekitar detik 82. Ada diagram bertulisan di layar
      (detik 57–80) untuk menguji label sumber speech vs on_screen_text.
      Delapan istilah yang diucapkan tercantum di docs/reference/hasil-uji-kelayakan.md.
    gold: docs/eval/kunci-jawaban/ngertibatik-proses.csv   # belum dibuat

  - id: nglowong
    youtube_id: rKVEysItoKY
    start_s: 0
    duration_s: 132
    purpose: Satu tahap, close-up, presenter berbicara. Dipakai juga untuk uji dengan/tanpa audio (Gate 0).
    gold: docs/eval/kunci-jawaban/nglowong.csv   # belum dibuat

  - id: kontrol-musik-nglorod
    youtube_id: J_XcGhkCRAQ
    start_s: 0
    duration_s: 227
    purpose: KONTROL NEGATIF. Hanya musik, tanpa ucapan. Harus menghasilkan 0 istilah speech.
    gold: null

  - id: trusmi-maestro-15-20
    youtube_id: 8sMSLQPYNc4
    start_s: 900
    duration_s: 300
    purpose: >
      Wawancara maestro Batik Trusmi Cirebon, ucapan spontan. Menit 15–20 adalah bagian paling
      teknis menurut kepadatan istilah di subtitle.
    gold: docs/eval/kunci-jawaban/trusmi-maestro-15-20.csv   # belum dibuat

