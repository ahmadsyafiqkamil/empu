# Video CC BY: bahan DEMO dan set uji utama (keputusan 28 Okt).
# Lisensi diverifikasi 28 Okt 2026 via metadata YouTube (yt-dlp: "Creative Commons Attribution license
# (reuse allowed)"). Boleh tampil publik DENGAN atribusi: kreator, URL, "CC BY", dan "dipotong".
# Video tetap TIDAK di-commit. Unduh ke data-uji/cc-by/ dengan:
#   yt-dlp -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 \
#     --write-subs --write-auto-subs --sub-langs "id,id-orig" \
#     -o "data-uji/cc-by/%(title)s [%(id)s].%(ext)s" <url>
# Prioritas: 1 = demo utama + kunci jawaban, 2 = pelengkap arsip, 3 = cadangan.
